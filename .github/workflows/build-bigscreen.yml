name: Build NerdQAxe++ 3.5" (480x320) firmware

on:
  push:
    branches: [ 'bigscreen-*' ]
    tags: [ 'v*-bigscreen*' ]
  workflow_dispatch:

env:
  BOARD: NERDQAXEPLUS2
  # asset names the web UI looks for (deviceModel); the tag marks the big-screen build
  LABEL: NerdQAxe++
  IDF_IMAGE: shufps/esp-idf-builder:5.3.6

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Get Version Tag
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          version="${{ github.ref_name }}"
        else
          version="$(git describe --tags --abbrev=0)-bigscreen-$(git rev-parse --short HEAD)"
        fi
        echo "VERSION_TAG=${version}" >> $GITHUB_ENV
        echo "${version}" > version.txt
        echo "VERSION_TAG=${version}"

    - name: Insert Version
      run: |
        set -e
        COMMIT_HASH=$(git rev-parse --short HEAD)
        sed -e "s|__COMMIT__|${COMMIT_HASH}|g" -i ./main/http_server/axe-os/src/app/app.module.ts
        sed -e "s|__VERSION__|${VERSION_TAG}|g" -i ./main/http_server/axe-os/src/app/app.module.ts
        for l in de en es fr it pl ro da zh-CN; do
          mv "./main/http_server/axe-os/src/assets/i18n/${l}.json" "./main/http_server/axe-os/src/assets/i18n/${l}.${COMMIT_HASH}.json"
        done

    - name: Set Target
      run: |
        docker run --rm --user root -e BOARD=$BOARD -e BIGSCREEN=1 -e SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bigscreen" \
        -v $PWD:/home/builder/project $IDF_IMAGE idf.py set-target esp32s3

    - name: Compile Binaries
      run: |
        docker run --rm --user root -e BOARD=$BOARD -e BIGSCREEN=1 -e SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bigscreen" \
        -v $PWD:/home/builder/project $IDF_IMAGE bash -c \
        'idf.py build && apt-get update && apt-get install -y openssl && python tools/test_ca_bundle.py --build-dir build'

    - name: Verify big-screen configuration
      run: |
        grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE="32MB"' sdkconfig || { echo "::error::flash size is not 32MB"; exit 1; }
        grep -q '^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions-bigscreen.csv"' sdkconfig || { echo "::error::wrong partition table"; exit 1; }
        ls -l build/esp-miner.bin build/www.bin

    - name: Merge Binaries
      run: |
        docker run --rm --user root -v $PWD:/home/builder/project \
        $IDF_IMAGE esptool.py --chip esp32s3 merge_bin --flash_mode dio --flash_size 32MB --flash_freq 80m \
        0x0 build/bootloader/bootloader.bin \
        0x8000 build/partition_table/partition-table.bin \
        0x10000 build/esp-miner.bin \
        0xf10000 build/ota_data_initial.bin \
        0x1000000 build/www.bin \
        -o esp-miner-factory-$LABEL-$VERSION_TAG.bin

    - name: Collect artifacts
      run: |
        mkdir -p out
        sudo cp build/esp-miner.bin out/esp-miner-$LABEL.bin
        sudo cp build/esp-miner.elf out/esp-miner-$LABEL.elf
        sudo cp build/www.bin out/www.bin
        sudo cp esp-miner-factory-$LABEL-$VERSION_TAG.bin out/
        cd out && sha256sum * | tee SHA256SUMS.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ env.LABEL }}-${{ env.VERSION_TAG }}
        path: out/

    - name: Publish release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$VERSION_TAG" --prerelease --title "$VERSION_TAG" \
          --notes "NerdQAxe++ clones with a 3.5\" 480x320 screen and 32MB flash. OTA: esp-miner-$LABEL.bin, then www.bin. USB: the factory image (keeps no settings)." \
          out/esp-miner-$LABEL.bin out/www.bin out/esp-miner-factory-$LABEL-$VERSION_TAG.bin out/SHA256SUMS.txt
